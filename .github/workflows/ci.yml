name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck and test suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:all = typecheck + unit + seed-data QA + local-model manager +
      # golden retrieval + edge cases + chat scenarios. Keep this the single
      # source of truth so CI and local runs cannot drift.
      - name: Run full check suite
        run: npm run test:all
